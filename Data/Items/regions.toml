# ============================================
# リージョンマスターデータ
# ============================================
# マップを5x5のエリア（リージョン）に分割
# 各リージョンは5x5のタイルで構成

# ============================================
# 中央平原リージョン (0,0)
# ============================================

[[regions]]
id = 1
name = "中央平原"
japanese_name = "中央平原"
region_x = 0
region_y = 0
description = "冒険者の出発地点となる広い平原"
difficulty = 1
weather = "Clear"

# 5x5タイル定義（y, x順）
tiles = """
.........
...T.....
..RRR....
.RGRGR...
.GR.GR..
..G.G...
..RRR...
...S....
.........
"""

# 意味:
# . = 草原 (grass)
# T = 町 (town)
# R = 道 (road)
# G = 草原 (grass)
# S = 泉 (spring)

