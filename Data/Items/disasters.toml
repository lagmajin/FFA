# ============================================
# 自然災害マスターデータ
# ============================================
# 天气システム基础上追加の特殊災害
# 基本的にはデメリットがあるが、大きいメリットもある

# ============================================
# 干ばつ (Drought)
# ============================================

[[disasters]]
id = 1
name = "干ばつ"
japanese_name = "干ばつ"
icon = "🏜️"
description = "長引く日照り。水不足になり、作物が枯れる。"
base_weather = "HeatWave"
duration_hours = 24
rarity_weight = 15

# デメリット
[[disasters.effects]]
type = "debuff"
target = "all"
description = "全回復アイテムの効果-20%"
heal_modifier = -0.20

[[disasters.effects]]
type = "debuff"
target = "water"
description = "水辺での回復不可"
disable_water_heal = true

[[disasters.effects]]
type = "debuff"
target = "field"
description = "草原でのドロップ率-30%"
drop_rate_modifier = -0.30

# メリット
[[disasters.effects]]
type = "buff"
target = "fire"
description = "火属性ダメージ+30%"
element_damage_modifier = 0.30

[[disasters.effects]]
type = "buff"
target = "special"
description = "隠された砂漠のダンジョンが開かれる"
unlocks_location = "desert_dungeon"

[[disasters.effects]]
type = "buff"
target = "special"
description = "貴重矿石出現率+50%"
ore_drop_rate_modifier = 0.50

