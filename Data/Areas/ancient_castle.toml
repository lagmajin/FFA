# Ancient Castle Ruins - area data (pure map data, no monsters/facilities)
# ID should match the special tag referenced in world maps: "dungeon:ancient_castle"

id = "area:ancient_castle"
name = "古城跡"
description = "かつての王城の遺構。複数階層から成る古い城塞エリア。ダンジョン表記ではなくエリアとして扱います。"
entrance_world_tag = "area:ancient_castle" # link from WorldGridService cell.special
recommended_level = 5

# Floor definitions: each floor has its own simple grid and named rooms
