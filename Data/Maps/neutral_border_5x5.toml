# Neutral Border Regions Map (TOML)
# 国と国の中間地域マップデータ
# 中立地帯 - 各国につながる anúncio地域

[width] = 5
height = 5

[start_position]
x = 2
y = 2
country = "Neutral"
capital = "Haven"

# ============================================
# 主要施設
# ============================================

[[locations]]
# 中立地帯の首都/ハブ
x = 2
y = 2
name = "Haven"
type = "Town"
description = "中立地帯の首都。全ての国からの 여행者が集まる安全な港。"
country = "Neutral"
population = 15000
facilities = ["宿屋", "銀行", "ギルド本部", "交易所", "武器屋", "防具屋"]
is_capital = true

[[locations]]
# 村
x = 0
y = 2
name = "Crossroads"
type = "Village"
description = "四つの道が交わる十字路の村。"
population = 800
facilities = ["宿屋", "材料屋"]

[[locations]]
# 村
x = 4
y = 2
name = "Gateway"
type = "Village"
description = "東への門がある村。"
population = 600
facilities = ["宿屋", "通貨両替"]

[[locations]]
# 村
x = 2
y = 0
name = "Highland"
type = "Village"
description = "高台にある小さな村。"
population = 400
facilities = ["宿屋", "材料屋"]

# ============================================
# フィールド/平原
# ============================================

[[locations]]
x = 1
