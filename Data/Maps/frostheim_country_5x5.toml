# Frostheim Country 5x5 expanded map (TOML)
# Origin: 雪国 (Frostheim)
# Grid: 5 x 5 (0..4)

width = 5
height = 5

[start_position]
x = 2
y = 2
country = "Frostheim"
capital = "Glaciermount"

